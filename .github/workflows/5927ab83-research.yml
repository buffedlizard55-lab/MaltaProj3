# Session arena-5927ab83: fresh read-only coverage and no-line research.
# Never deploys and never commits the shared replay fixtures or generated site.
name: 5927ab83 fresh coverage and line research (never deploys)
on:
  workflow_dispatch:
  push:
    branches: ['arena/5927ab83-maltaproj3']
    paths:
      - '.github/workflows/5927ab83-research.yml'

permissions:
  contents: write
concurrency:
  group: 5927ab83-research
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == 'refs/heads/arena/5927ab83-maltaproj3'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arena/5927ab83-maltaproj3
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Refresh the official Hotspawn inventory and featured external lines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.collect

      - name: Resolve only the remaining fixtures with the reviewed research ladder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.originate --live

      - name: Replay every active row and probability against original evidence
        run: |
          python -m scripts.pipeline_audit --source data \
            --output data/research/5927ab83/live-source-integrity-audit.json
          python -m scripts.e7d7a410_audit --data data \
            --out data/research/5927ab83 --strict

      - name: HLTV first, then esportsbooks and exchanges for every no-line fixture
        run: python -m scripts.103774c3_probe --out data/research/5927ab83

      - name: Preserve the audited feeds and identify this session's report
        env:
          AUDIT_RUN_ID: ${{ github.run_id }}
          AUDIT_SHA: ${{ github.sha }}
          AUDIT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p data/research/5927ab83/live
          cp data/latest.json data/origination.json data/sources.json \
            data/research/5927ab83/live/
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('data/research/5927ab83')
          research_path = root / 'line-source-research.json'
          research = json.loads(research_path.read_text())
          # The read-only implementation is shared with session 103774c3; the
          # observation itself belongs to this run and output directory.
          research['session'] = 'arena-5927ab83'
          research['probe_implementation'] = 'scripts/103774c3_probe.py'
          research['audit_run_url'] = os.environ['AUDIT_RUN_URL']
          research_path.write_text(json.dumps(research, indent=2, ensure_ascii=False) + '\n')
          md_path = research_path.with_suffix('.md')
          md = md_path.read_text().replace(
              'Line-source research for fixtures without a betting line — arena-103774c3',
              'Line-source research for fixtures without a betting line — arena-5927ab83', 1)
          md_path.write_text(md)

          files = {}
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'manifest.json':
                  files[path.relative_to(root).as_posix()] = {
                      'bytes': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
          manifest = {
              'schema_version': 1,
              'session': 'arena-5927ab83',
              'observed_at': datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z'),
              'run_id': int(os.environ['AUDIT_RUN_ID']),
              'run_url': os.environ['AUDIT_RUN_URL'],
              'source_sha': os.environ['AUDIT_SHA'],
              'shared_replay_fixtures_changed': False,
              'probabilities_or_picks_written_by_this_metadata_step': False,
              'files': files,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Commit only this session's dated research and audited feed copies
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/5927ab83 .github/workflows/5927ab83-research.yml
          git diff --cached --quiet && echo 'No research change.' && exit 0
          git commit -m 'research(5927ab83): fresh full coverage and HLTV-first no-line sweep'
          # Collection intentionally leaves the shared replay fixtures and many
          # generated evidence files dirty in this ephemeral runner. Stash those
          # uncommitted changes before rebase; the audited research is already
          # committed and no generated value is discarded from that record.
          git stash push --include-untracked -m '5927ab83 generated collection scratch'
          for attempt in 1 2 3 4; do
            git fetch origin arena/5927ab83-maltaproj3
            git rebase origin/arena/5927ab83-maltaproj3 || { git rebase --abort || true; sleep 5; continue; }
            git push origin HEAD:arena/5927ab83-maltaproj3 && exit 0
            sleep 5
          done
          exit 1
