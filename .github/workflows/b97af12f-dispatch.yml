# Session arena-b97af12f — tiny publisher unstick.
#
# The four-hour pages.yml push runs are being cancelled while pending because
# every merge to main enters the same concurrency group. The sandbox's GitHub
# integration token cannot call `gh workflow run` (HTTP 403), but a workflow's
# own GITHUB_TOKEN can be granted actions: write. This single-step job does only
# that dispatch, on the separate pages-workflow_dispatch concurrency group. It
# never edits the repository, never reads betting data and never deploys itself.
#
# A unique concurrency group per run prevents a later push to this session
# branch from cancelling the dispatch before it gets a runner.
name: b97af12f publisher dispatch
on:
  push:
    branches: ['arena/b97af12f-maltaproj3']
permissions:
  contents: read
  actions: write
concurrency:
  group: b97af12f-dispatch-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  dispatch:
    if: "!startsWith(github.event.head_commit.message, 'research(b97af12f)')"
    # Ubuntu runners are saturated by parallel session workflows on 2026-10-24;
    # a macOS runner has a separate pool and this job only needs `gh` + bash.
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - name: Dispatch the four-hour publisher on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run pages.yml --ref main
          echo "Dispatched pages.yml on main (workflow_dispatch group)."
