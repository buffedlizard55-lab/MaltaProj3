name: Public source diagnostics
on:
  push:
    branches: ['arena/**']
    paths: ['scripts/audit_sources.py', 'scripts/review_sources.py', '.github/workflows/source-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Inspect original public source responses
        run: python -m scripts.audit_sources
      - uses: actions/upload-artifact@v6
        with:
          name: public-source-diagnostics
          path: .cache/source-audit/
          retention-days: 3
# Completed session evidence is immutable in data/research/6426358d/observed-*.
# No permanent workflow writes to a finished session branch or retimes that audit.
# Live inventory, lines and lineup proof refresh in the sole pages.yml publisher.
