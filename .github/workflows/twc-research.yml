name: TWC source research
on:
  push:
    branches: ['arena/8a6a5a84-maltaproj3']
    paths: ['.github/workflows/twc-research.yml']
  workflow_dispatch:
    inputs:
      export:
        description: Export dated research to this session branch (never main)
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Collect inventory and every supported pick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.collect
          python -m scripts.originate --live
      - name: Read original TWC event and match sources
        run: python -m scripts.twc_research
      - name: Save dated coverage review
        run: |
          mkdir -p .cache/twc-export
          cp -r data/research/twc-current .cache/twc-export/
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.load(open('data/latest.json'))
          o = json.load(open('data/origination.json'))
          report = {'policy': 'Dated diagnostic, not live inventory or independently replayed current probabilities. See canonical published picks for current evidence.', 'inventory_observed_at': d.get('inventory_observed_at'), 'coverage_complete': d.get('coverage_complete'), 'counts': o['counts'], 'matches': o['matches'], 'sources': d.get('sources', [])}
          Path('.cache/twc-export/coverage.json').write_text(json.dumps(report, indent=2) + '\n')
          print('::notice title=Coverage diagnostic::' + json.dumps({k: report[k] for k in ['inventory_observed_at', 'coverage_complete', 'counts']}))
          PY
      - name: Export only to the fixed session branch when explicitly requested
        if: (inputs.export || github.event_name == 'push') && github.ref == 'refs/heads/arena/8a6a5a84-maltaproj3'
        run: |
          git restore data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p data/research/8a6a5a84
          cp -r .cache/twc-export/. data/research/8a6a5a84/
          python - <<'PYCODE'
          import subprocess
          for command in [['git', 'add', 'data/research/8a6a5a84'],
                          ['git', 'commit', '-m', 'research: retain dated TWC originals and coverage diagnostic'],
                          ['git', 'pull', '--rebase', 'origin', 'main'],
                          ['git', 'push', 'origin', 'arena/8a6a5a84-maltaproj3']]:
              result = subprocess.run(command, text=True, capture_output=True)
              message = (result.stdout + result.stderr).replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
              print('::notice title=Research export::' + message, flush=True)
              if result.returncode:
                  raise SystemExit(result.returncode)
          PYCODE
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: twc-research
          path: .cache/twc-export/
          retention-days: 14
