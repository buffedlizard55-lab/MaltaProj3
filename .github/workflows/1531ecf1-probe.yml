# Session arena-1531ecf1 — read-only gap-pick research probe.
#
# Dispatch only plus a guarded push trigger: it is never scheduled and it never
# deploys. The coding sandbox has no egress to Hotspawn, HLTV or any bookmaker;
# the GitHub runner does. This workflow runs scripts/1531ecf1_gap_research.py
# there — HLTV first, then esportsbooks and esports betting-line services — for
# every Hotspawn CS2 fixture the published snapshot cannot resolve the featured
# way, and commits only the dated reports under data/research/1531ecf1/.
#
# The push guard skips runs whose head commit is the workflow's own report
# commit (message starts with 'research(1531ecf1)'), so a report push can never
# re-trigger the probe in a loop.
name: 1531ecf1 gap-pick research probe (never deploys)
on:
  workflow_dispatch:
  push:
    branches: ['arena/1531ecf1-maltaproj3']
permissions:
  contents: write
concurrency:
  group: 1531ecf1-gap-research
  cancel-in-progress: true
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'research(1531ecf1)')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect the live Hotspawn inventory (restored before commit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.collect
      - name: Resolve every fixture with the published research ladder (restored before commit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.originate --live
      - name: Research picks for unresolved fixtures (HLTV first, then esportsbooks)
        run: python -m scripts.1531ecf1_gap_research --live
      - name: Restore every tracked data file so only the research report is committed
        run: |
          git checkout -- data/latest.json data/sources.json data/origination.json 2>/dev/null || true
          git checkout -- data/evidence data/origination 2>/dev/null || true
          git status --porcelain
      - name: Commit the dated research report to this session branch
        run: |
          git config user.name 'arena-1531ecf1 probe'
          git config user.email 'actions@users.noreply.github.com'
          git add data/research/1531ecf1
          if git diff --cached --quiet; then
            echo 'no report changes'
            exit 0
          fi
          git commit -m 'research(1531ecf1): dated gap picks + HLTV-first line-source sweep'
          git pull --rebase origin arena/1531ecf1-maltaproj3
          git push origin arena/1531ecf1-maltaproj3
