# Session arena-3a5448de — read-only live research for featured-blank fixtures.
# Dispatch/push on this file or the probe only. Never scheduled, never deploys,
# never feeds the published dashboard probabilities. The sandbox has no egress
# to Hotspawn/HLTV/books; the runner does. Removed before merge (the probe
# script and its dated evidence stay, like earlier session probes).
name: 3a5448de featured-blank fixture research (session only)
on:
  workflow_dispatch:
  push:
    branches: ['arena/3a5448de-maltaproj3']
    paths:
      - '.github/workflows/3a5448de-probe.yml'
      - 'scripts/3a5448de_probe.py'
permissions:
  contents: write
concurrency:
  group: 3a5448de-probe
  cancel-in-progress: true
jobs:
  probe:
    if: github.ref == 'refs/heads/arena/3a5448de-maltaproj3'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh live Hotspawn inventory and featured picks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.collect || echo "::warning::collect failed; probe continues on checked-in snapshot"
      - name: Resolve complete picks (HLTV -> books -> models ladder)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.originate --live || echo "::warning::originate failed; probe continues on checked-in origination"
      - name: Probe HLTV then esportsbooks for every featured-blank / non-money fixture
        run: python -m scripts.3a5448de_probe --out data/research/3a5448de
      - name: Commit dated evidence to this session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/3a5448de
          git diff --cached --quiet && exit 0
          git commit -m 'research(3a5448de): live featured-blank fixture probe'
          git stash push --keep-index --include-untracked -m '3a5448de probe scratch' || true
          for attempt in 1 2 3 4; do
            git fetch origin arena/3a5448de-maltaproj3 || true
            git rebase origin/arena/3a5448de-maltaproj3 || { git rebase --abort || true; sleep 5; continue; }
            git push origin HEAD:arena/3a5448de-maltaproj3 && exit 0
            sleep 5
          done
          exit 1
