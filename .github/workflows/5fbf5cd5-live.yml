# Session arena-5fbf5cd5 - live snapshot and coverage probe (never deploys).
#
# Dispatch only plus a guarded push trigger scoped to this workflow file. The
# coding sandbox has no egress to Hotspawn, HLTV, bo3.gg or any bookmaker; the
# GitHub runner does. This job runs the repository's own collectors there,
# archives the resulting snapshot and original evidence under
# data/research/5fbf5cd5/, and runs the read-only coverage probe so every
# pick-less or model-only fixture has a dated, source-linked record.
#
# It writes no probability, no pick and no alias of its own. It never touches
# main and never deploys a Pages artifact.
name: 5fbf5cd5 live snapshot and coverage probe (never deploys)
on:
  workflow_dispatch:
  push:
    branches: ['arena/5fbf5cd5-maltaproj3']
    paths:
      - '.github/workflows/5fbf5cd5-live.yml'
      - 'scripts/coverage_5fbf5cd5.py'
permissions:
  contents: write
  actions: read
concurrency:
  group: 5fbf5cd5-live
  cancel-in-progress: true
jobs:
  probe:
    if: github.ref == 'refs/heads/arena/5fbf5cd5-maltaproj3'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect the live Hotspawn inventory and featured external lines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.collect
      - name: Resolve every fixture with the published research ladder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.originate --live
      - name: Probe HLTV, bo3.gg and EGamersWorld for every active fixture
        run: |
          if python -m scripts.coverage_5fbf5cd5 --live; then
            echo "coverage probe ok"
          else
            echo "::warning::coverage probe failed; the archive keeps the collector's own reasons"
          fi
      - name: Document why every blank pick stayed blank
        run: |
          if python -m scripts.coverage_probe --live --out data/research/5fbf5cd5/live/coverage-probe.json; then
            echo "blank dossier ok"
          else
            echo "::warning::blank dossier failed; earlier probe output is retained"
          fi
      - name: Archive the live snapshot, its evidence and the site the build produces
        run: |
          set -eu
          DAY="$(date -u +%Y-%m-%d)"
          DEST="data/research/5fbf5cd5/live-${DAY}"
          mkdir -p "$DEST"
          cp data/latest.json "$DEST/latest.json"
          cp data/sources.json "$DEST/sources.json"
          cp data/origination.json "$DEST/origination.json"
          rm -rf "$DEST/evidence" "$DEST/origination-evidence"
          cp -r data/evidence "$DEST/evidence"
          if [ -d data/origination/evidence ]; then cp -r data/origination/evidence "$DEST/origination-evidence"; fi
          mv data/research/5fbf5cd5/live/coverage-probe.json "$DEST/coverage-probe.json" 2>/dev/null || true
          rmdir data/research/5fbf5cd5/live 2>/dev/null || true
      - name: Record the probe environment and a snapshot digest
        run: |
          DAY="$(date -u +%Y-%m-%d)"
          DEST="data/research/5fbf5cd5/live-${DAY}"
          python - "$DEST" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          dest = Path(sys.argv[1])
          snapshot = json.loads((dest / 'latest.json').read_text())
          origination = json.loads((dest / 'origination.json').read_text())
          active = [m for m in snapshot.get('matches') or []
                    if m.get('availability') in {'open', 'locked', 'unknown_lock'}]
          orig_active = [m for m in origination.get('matches') or []
                         if m.get('availability') != 'past']
          summary = {
              'environment': 'github-actions-runner',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'commit': os.environ.get('GITHUB_SHA'),
              'generated_at': snapshot.get('generated_at'),
              'inventory_observed_at': snapshot.get('inventory_observed_at'),
              'counts': snapshot.get('counts'),
              'origination_counts': origination.get('counts'),
              'active_fixtures': len(active),
              'origination_active': len(orig_active),
              'digest_sha256': {
                  name: hashlib.sha256((dest / name).read_bytes()).hexdigest()
                  for name in ('latest.json', 'origination.json', 'sources.json')
              },
          }
          (dest / 'summary.json').write_text(json.dumps(summary, indent=1) + '\n')
          print(json.dumps(summary, indent=1))
          PY
      - name: Restore tracked data so only this session's research is committed
        run: |
          git checkout -- data/latest.json data/sources.json data/origination.json 2>/dev/null || true
          git checkout -- data/evidence 2>/dev/null || true
          git checkout -- data/origination 2>/dev/null || true
          git clean -fd data/evidence data/origination >/dev/null 2>&1 || true
      - name: Commit the archived snapshot to this session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/5fbf5cd5
          git diff --cached --quiet && echo 'no new evidence' && exit 0
          git commit -m 'research(5fbf5cd5): live snapshot, evidence and coverage probe'
          for attempt in 1 2 3 4; do
            git fetch origin arena/5fbf5cd5-maltaproj3 || true
            git rebase origin/arena/5fbf5cd5-maltaproj3 || { git rebase --abort || true; sleep 5; continue; }
            git push origin HEAD:arena/5fbf5cd5-maltaproj3 && exit 0
            sleep 5
          done
          exit 1
