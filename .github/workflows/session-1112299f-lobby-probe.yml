name: Session 1112299f lobby probe
# Diagnostic only: reads public Hotspawn pages, writes one evidence file to this session branch, never deploys.
on:
  push:
    branches: [arena/1112299f-maltaproj3]
    paths: ['scripts/lobby_probe.py', '.github/workflows/session-1112299f-lobby-probe.yml']
permissions:
  contents: write
concurrency:
  group: session-1112299f-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/arena/1112299f-maltaproj3'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe the lobby pages against the fixture API
        run: python -m scripts.lobby_probe --rounds 3 --pause 25 --out data/research/1112299f/lobby-probe.json
      - name: Export the evidence file to this session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/1112299f/lobby-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(1112299f): Hotspawn lobby/API probe evidence'
          git pull --rebase origin arena/1112299f-maltaproj3
          git push origin arena/1112299f-maltaproj3
