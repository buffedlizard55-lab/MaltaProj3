# Session arena-fc985c7b — live coverage audit + HLTV-first line research.
#
# Dispatch-only, never scheduled, never deploys. The coding sandbox has no
# egress to Hotspawn/HLTV/the esportsbooks; the runner does. This workflow runs
# the exact same first-party refresh the production publisher runs
# (scripts.collect, then scripts.originate --live), then runs the read-only
# audit against that fresh snapshot and commits only the dated JSON/Markdown
# evidence back to this session branch for review before merge.
#
# scripts/fc985c7b_audit.py never writes a probability, a pick or an alias.
# The refreshed data/ files themselves are NOT committed here — pages.yml
# remains the single writer of the published snapshot.
name: fc985c7b coverage and line research (dispatch only)
on:
  workflow_dispatch:
  # `gh workflow run` only resolves workflows that are already registered, and
  # a brand-new file on a session branch is not until it has run once. Pushing
  # the probe file itself is therefore the reliable trigger (same pattern as
  # 103774c3-probe.yml); it still never deploys and only writes research.
  push:
    branches: ['arena/fc985c7b-maltaproj3']
    paths:
      - '.github/workflows/fc985c7b-probe.yml'
      - 'scripts/fc985c7b_audit.py'

permissions:
  contents: write
concurrency:
  group: fc985c7b-probe
  cancel-in-progress: true
jobs:
  probe:
    if: github.ref == 'refs/heads/arena/fc985c7b-maltaproj3'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arena/fc985c7b-maltaproj3
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # Same first-party refresh as pages.yml, so the audit targets the
      # fixtures that are live *now*, not the checked-in fixture data.
      - name: Refresh canonical inventory and featured lines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.collect
      - name: Refetch first-party origination sources and resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.originate --live
      - name: Publish the coverage summary for this run
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          snap = json.loads(Path('data/latest.json').read_text())
          print('Refreshed snapshot', snap['generated_at'], snap['counts'])
          PY
      - name: Live coverage audit and HLTV-first line research
        if: always()
        run: python -m scripts.fc985c7b_audit --out data/research/fc985c7b
      - name: Commit only the dated research record to this session branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -f data/research/fc985c7b/line-source-research.json
          git add data/research/fc985c7b scripts/fc985c7b_audit.py .github/workflows/fc985c7b-probe.yml
          git diff --cached --quiet && echo 'No research change.' && exit 0
          git commit -m 'research(fc985c7b): live coverage audit and HLTV-first line sweep — dated evidence'
          git stash push --keep-index --include-untracked -m 'fc985c7b probe scratch' || true
          for attempt in 1 2 3 4; do
            git fetch origin arena/fc985c7b-maltaproj3 || true
            git rebase origin/arena/fc985c7b-maltaproj3 || { git rebase --abort || true; sleep 5; continue; }
            git push origin HEAD:arena/fc985c7b-maltaproj3 && exit 0
            sleep 5
          done
          exit 1
