name: Refresh CS2 public-source data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cs2-data-refresh
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    # Scheduled jobs run on the default branch. The condition prevents a manual
    # dispatch from deploying an arbitrary feature branch as the production site.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh public data
        run: node scripts/refresh-data.mjs
      - name: Verify data and static files
        run: node scripts/verify-site.mjs
      - name: Commit a changed snapshot
        run: |
          if git diff --quiet -- data/matches.json data/review.json; then
            echo 'No published data changes.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/matches.json data/review.json
            git commit -m 'chore(data): refresh CS2 source snapshot'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Assemble static artifact
        run: |
          mkdir -p _site/assets _site/data
          cp index.html picks.html methodology.html flagged.html _site/
          cp -R assets/. _site/assets/
          cp -R data/. _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
