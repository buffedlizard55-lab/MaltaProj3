# Session arena-89c00d8a — fresh, read-only source research (never deploys).
# Dispatch only. The runner collects the live lobby and runs the reviewed
# origination ladder, then commits evidence only under this session's directory.
name: 89c00d8a fresh CS2 research (never deploys)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: 89c00d8a-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect every current Hotspawn CS2 fixture and supported outside line
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.collect
      - name: Resolve the complete list with the reviewed ladder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.originate --live
      - name: HLTV-first then esportsbook/exchange research for non-money rows only
        run: python -m scripts.2016c841_research --origination data/origination.json --out data/research/89c00d8a
      - name: Preserve the exact fresh snapshot pair and replay evidence
        run: |
          mkdir -p data/research/89c00d8a/live
          cp data/latest.json data/research/89c00d8a/live/latest.json
          cp data/origination.json data/research/89c00d8a/live/origination.json
          cp data/sources.json data/research/89c00d8a/live/sources.json
          cp data/origination/aliases.json data/research/89c00d8a/live/aliases.json
          cp -r data/evidence data/research/89c00d8a/live/evidence
          cp -r data/origination/evidence data/research/89c00d8a/live/origination-evidence
          date -u +%Y-%m-%dT%H:%M:%SZ > data/research/89c00d8a/live/OBSERVED_AT.txt
      - name: Restore tracked replay fixtures so only this session's evidence is committed
        run: |
          git checkout -- data/latest.json data/sources.json data/origination.json data/origination/aliases.json
          git checkout -- data/evidence data/origination/evidence 2>/dev/null || true
          git clean -fd data/evidence data/origination/evidence >/dev/null 2>&1 || true
          git status --short
      - name: Commit dated evidence to the dispatching session branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/89c00d8a .github/workflows/89c00d8a-research.yml
          if git diff --cached --quiet; then echo 'no evidence change'; exit 0; fi
          git commit -m 'research(89c00d8a): fresh Hotspawn coverage and outside-line sweep'
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
