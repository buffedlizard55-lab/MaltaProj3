# Session arena-b97af12f — direct publisher trigger via repository_dispatch.
#
# The sandbox GitHub App token cannot call the workflow-dispatch endpoint
# (HTTP 403), but it CAN create a repository_dispatch event (verified
# 2026-10-24T07:22Z). This tiny listener therefore gives the integration
# session a reliable, authenticated way to ask pages.yml to run: the job's own
# GITHUB_TOKEN is granted actions: write and calls `gh workflow run pages.yml
# --ref main`, which lands in the separate pages-workflow_dispatch group and
# cannot be cancelled by rapid push-triggered main runs.
#
# macOS runners are used because the Ubuntu pool was saturated by parallel
# session workflows on 2026-10-24; this job only needs bash and gh.
name: b97af12f repository-dispatch publisher
on:
  repository_dispatch:
    types: [b97_publisher_dispatch]
permissions:
  contents: read
  actions: write
concurrency:
  group: b97af12f-repo-dispatch-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - name: Dispatch the four-hour publisher on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run pages.yml --ref main
          echo "repository_dispatch $(jq -r .action < "$GITHUB_EVENT_PATH" 2>/dev/null || echo b97_publisher_dispatch) -> pages.yml workflow_dispatch"
