# Session arena-46ade650 — read-only line-source research on the GitHub runner.
#
# The sandbox this session runs in has no egress to Hotspawn, HLTV, bo3.gg or any
# bookmaker; the runner does. This workflow therefore collects the current
# inventory, runs the origination ladder, and then probes every fixture that is
# still without an external betting line (HLTV first, then esportsbooks and
# aggregators). It writes dated evidence to data/research/46ade650/ and commits
# that directory only.
#
# It never writes a probability, a pick or an alias into the published snapshot,
# never deploys, and is dispatch-only so its own evidence commit cannot retrigger
# it.
name: 46ade650 line-source research (dispatch only)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: 46ade650-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arena/46ade650-maltaproj3
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh the Hotspawn inventory and the current picks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.collect || echo "::warning::collect failed; the probe continues on the checked-in snapshot"
          python -m scripts.originate --live || echo "::warning::originate failed; the probe continues on the checked-in origination"
      - name: Probe HLTV, esportsbooks and aggregators for every fixture without a line
        run: python -m scripts.46ade650_probe --out data/research/46ade650
      - name: Summarise the result in the job log
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/research/46ade650/line-source-research.json')
          doc = json.loads(p.read_text())
          per = doc.get('per_fixture') or []
          print(f"targets={len(per)} leads={len(doc.get('leads') or [])}")
          for row in per:
              print(' -', ' vs '.join(row['teams']), '|', row['current_method'], '|', row['verdict'])
          reachable = [pg for pg in doc.get('extra_pages') or [] if pg.get('status') == 200]
          print(f"reachable extra surfaces: {len(reachable)}/{len(doc.get('extra_pages') or [])}")
          PY
      - name: Commit the dated report to this session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/46ade650
          git diff --cached --quiet && exit 0
          git commit -m 'research: 46ade650 line-source probe for fixtures without a betting line'
          git stash push --keep-index --include-untracked -m '46ade650 probe scratch' || true
          for attempt in 1 2 3 4; do
            git fetch origin arena/46ade650-maltaproj3 || true
            git rebase origin/arena/46ade650-maltaproj3 || { git rebase --abort || true; sleep 5; continue; }
            git push origin HEAD:arena/46ade650-maltaproj3 && exit 0
            sleep 5
          done
          exit 1
