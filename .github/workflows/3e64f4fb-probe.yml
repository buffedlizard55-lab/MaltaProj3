name: 3e64f4fb HLTV-first research probe

# Session arena-3e64f4fb. The authoring sandbox cannot reach play.hotspawn.com,
# hltv.org or any esportsbook, so this runner records what those surfaces
# publish for the fixtures whose pick is not a featured market line. Evidence
# only: no probability, pick or alias is produced. The push trigger is
# path-scoped to this workflow and its probe module, and the evidence commit
# carries [skip ci], so the evidence commit cannot re-trigger anything.
on:
  push:
    branches: ['arena/3e64f4fb-maltaproj3']
    paths:
      - '.github/workflows/3e64f4fb-probe.yml'
      - 'scripts/3e64f4fb_probe.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: 3e64f4fb-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    if: startsWith(github.ref_name, 'arena/3e64f4fb')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Live inventory, HLTV first, then esportsbooks (read-only, sweep 2 contracts)
        run: python -m scripts.3e64f4fb_probe --tag probe2
      - name: Re-parse archived bodies to prove the parsers replay offline
        run: python -m scripts.3e64f4fb_probe --parse-raw
      - name: Commit the dated evidence to this session branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/3e64f4fb/probe
          if git diff --cached --quiet; then
            echo 'No change in the recorded facts.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m 'research(3e64f4fb): HLTV-first + esportsbook probe evidence [skip ci]'
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
