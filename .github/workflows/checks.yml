name: Validate dashboard
on:
  pull_request:
    branches: [main]
  push:
    branches: ['arena/**']
    # 65E-1 (arena-65eec73f): a commit that only edits the shared board starts
    # no validation run. Code pushes are unaffected: any other changed file
    # still triggers this workflow. Measured 2026-10-24: 98 of the last 100
    # runs came from arena/** pushes, many of them board-only, starving the
    # scheduled and main-branch refreshes of runners.
    paths-ignore: ['COORDINATION.md']
permissions:
  contents: read
concurrency:
  group: dashboard-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Rows, build, links, mobile and accessibility
    runs-on: ubuntu-24.04
    # 15 minutes was not enough on 2026-10-21: job 119235008218 finished every
    # step successfully (unit suite, replay build, row-source audit, browser
    # install, 320/390/768/1440px UI checks) and was still cancelled by the
    # job-level cap at exactly 15m0s, which marked PR #112 red for a reason
    # unrelated to the code. The cap is raised, not the checks removed.
    # 2026-10-22: the same job took 12-13 minutes when idle but 25m52s on a
    # loaded runner and was cancelled at exactly 30m13s, which marked PR #172
    # red while the identical commit passed on the push-triggered run. The cap
    # is raised again (45 minutes) so shared-runner load cannot fail a check
    # that has not found a defect.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Test strict identity, pricing, fallback and failure handling
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee unittest-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '## unittest failures'
              echo '```'
              grep -E "^(FAIL|ERROR):|^Ran |^FAILED|^OK" unittest-output.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "^(FAIL|ERROR):" unittest-output.log | while IFS= read -r line; do
              echo "::error title=unittest::${line}"
            done
          fi
          exit "$status"
      - name: Replay every row, build all views and check local links
        run: python -m scripts.build
      - name: Every table row links an official source or is flagged unverified
        run: python -m scripts.audit_rows --site site --strict
      - name: Install browser for independent UI verification
        run: npx playwright install --with-deps chromium
      - name: Phone, desktop, no-JS, staleness and WCAG A/AA checks
        # The run log lives on a storage host that restricted environments
        # cannot reach, so a bare "exit code 1" named no failing test. Every
        # failed browser test is now also published as a check annotation,
        # which is readable through the public Actions API.
        run: |
          set +e
          npm test 2>&1 | tee playwright-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          def escape(text, limit=1200):
              return str(text).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')[:limit]

          report = Path('test-results/results.json')
          printed = 0
          if report.exists():
              try:
                  document = json.loads(report.read_text())
              except ValueError:
                  document = {}

              def walk(suites):
                  global printed
                  for suite in suites:
                      for spec in suite.get('specs') or []:
                          if spec.get('ok') is False:
                              for test in spec.get('tests') or []:
                                  for result in test.get('results') or []:
                                      for error in result.get('errors') or []:
                                          message = error.get('message') or error.get('value') or ''
                                          # Accessibility failures must name the element and the
                                          # measured contrast, not just 'a violation exists'.
                                          detail = ''
                                          import re as _re
                                          for target in _re.findall(r'"target" => Array \[\s*"([^"]+)"', message):
                                              detail += ' | selector: ' + target
                                          for summary in _re.findall(r'"failureSummary" => "([^"]+)"', message):
                                              detail += ' | ' + summary[:220]
                                          print('::error title=Browser test failed::' + escape(
                                              suite.get('file', '?') + ' :: ' + (spec.get('title') or '?') +
                                              ' :: ' + message[:500] + detail, 1800))
                                          printed += 1
                      walk(suite.get('suites') or [])
              walk(document.get('suites') or [])
          if not printed:
              tail = Path('playwright-output.log')
              if tail.exists():
                  lines = [l for l in tail.read_text(errors='replace').splitlines() if '✘' in l or 'Error' in l][-8:]
                  print('::error title=Browser tests failed without a parsed report::' + escape(' | '.join(lines)))
          PY
          fi
          exit "$status"
      - name: Upload browser test report (readable when the step fails)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Expire stale or locked recommendations in open tabs and without JavaScript
        run: node tests/pick-safety-browser.mjs
      - name: Publish test summary
        if: always()
        run: |
          echo '## Dashboard validation' >> "$GITHUB_STEP_SUMMARY"
          echo 'Checks cover source-row reconciliation, replayed calculations, internal links, a row-by-row official-source audit, 320/390/768/1440px layouts, phone navigation, search/filter/sort, evidence expansion, timezone switching, stale-snapshot behavior, no-JS content, and axe WCAG A/AA checks at phone and desktop widths.' >> "$GITHUB_STEP_SUMMARY"
