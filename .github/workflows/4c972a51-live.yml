name: 4c972a51 live diagnostics (session-only)
# Session arena-4c972a51. This workflow exists only to let the session observe
# the runner's own network egress: the development sandbox cannot reach
# Hotspawn, HLTV or any bookmaker, so the live snapshot and the reachability
# probe are produced here and committed back to the session branch. It edits no
# published file: everything it writes lives under data/research/4c972a51/.
# It is deleted before the pull request is merged.
# run: 2 (after wiring the published-rank tie-break into scripts/originate.py)
on:
  workflow_dispatch:
  push:
    branches: [arena/4c972a51-maltaproj3]
    paths:
      - 'scripts/diag_4c972a51.py'
      - 'scripts/probe_4c972a51.py'
      - '.github/workflows/4c972a51-live.yml'
permissions:
  contents: write
concurrency:
  group: session-4c972a51-live
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref == 'refs/heads/arena/4c972a51-maltaproj3'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect the live Hotspawn CS2 inventory and every supported external line
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.collect --output live
      - name: Provide the reviewed alias registry to the isolated output directory
        run: cp -r data/origination live/origination
      - name: Originate picks for the fixtures the featured method left blank
        id: originate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.originate --live --output live
      - name: Record the originate outcome (the diagnostic still runs on failure)
        run: echo "${{ steps.originate.outcome }}" > live/origination-outcome.txt
      - name: Write the compact diagnostic the session reads
        run: python -m scripts.diag_4c972a51 --data live --out data/research/4c972a51
      - name: Probe reachable independent sources (read-only, non-fatal)
        run: |
          if python -m scripts.probe_4c972a51 --data live --out data/research/4c972a51 --timeout 12; then
            echo "probe recorded"
          else
            echo "::warning::probe failed; the diagnostic above is still committed"
          fi
      - name: Keep the raw snapshot pair for replay
        run: |
          mkdir -p data/research/4c972a51/live
          cp live/latest.json data/research/4c972a51/live/
          cp live/origination.json data/research/4c972a51/live/ 2>/dev/null || true
          ls live > data/research/4c972a51/live/run-files.txt
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('latest', 'origination'):
              p = Path('data/research/4c972a51/live') / f'{name}.json'
              data = json.loads(p.read_text())
              p.write_text(json.dumps(data, ensure_ascii=False, indent=1) + '\n')
          PY
          du -sh data/research/4c972a51
      - name: Commit the observation to the session branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/4c972a51
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m 'data(4c972a51): live snapshot diagnostic and reachability probe [skip ci]'
          git pull --rebase origin arena/4c972a51-maltaproj3
          git push origin HEAD:arena/4c972a51-maltaproj3
      - name: Fail visibly when origination did not complete
        if: steps.originate.outcome != 'success'
        run: |
          echo "::error title=originate::python -m scripts.originate --live exited ${{ steps.originate.outcome }}"
          exit 1
