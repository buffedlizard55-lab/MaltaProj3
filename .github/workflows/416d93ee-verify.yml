name: 416d93ee independent verification
# Session-only workflow (arena/416d93ee): reads the published site and Hotspawn's
# own endpoints with a normal browser-like client, writes only
# data/research/416d93ee/, and never touches data/latest.json, data/origination.json,
# the collectors or another session's research directory. Deleted before merge;
# the captured evidence stays in the branch.
on:
  push:
    branches: [arena/416d93ee-maltaproj3]
    paths:
      - '.github/workflows/416d93ee-verify.yml'
      - 'scripts/416d93ee_audit.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: 416d93ee-verify
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/arena/416d93ee-maltaproj3'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Audit the published snapshot against first-party sources
        run: |
          set +e
          python -m scripts.416d93ee_audit --evidence data/research/416d93ee
          status=$?
          echo "audit_exit=$status" >> "$GITHUB_OUTPUT" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo '::warning title=416d93ee audit::one or more verification verdicts failed; the report below names which'
          fi
          exit 0
      - name: Publish the audit summary
        if: always()
        run: |
          {
            echo '## 416d93ee independent verification'
            echo ''
            cat data/research/416d93ee/verification.md || echo 'no report written'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the captured evidence to this session branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/416d93ee
          git diff --cached --quiet && exit 0
          git commit -m 'research(416d93ee): independent verification of the published picks'
          git pull --rebase origin arena/416d93ee-maltaproj3
          git push origin arena/416d93ee-maltaproj3
