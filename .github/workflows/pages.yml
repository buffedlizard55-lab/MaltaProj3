name: Refresh and deploy CS2 dashboard
on:
  push:
    branches: [main]
  schedule:
    # Primary four-hour refresh, off the top of the hour.
    - cron: '17 */4 * * *'
    # Catch-up slot two and a half hours later. GitHub delays or drops scheduled
    # runs under load (on 2026-10-15 only 04:39, 13:26 and 19:53 UTC ran: an
    # 8.8-hour gap). With this offset, one dropped slot still leaves a refresh
    # within about four hours, keeping the published data inside the 8-hour bound.
    - cron: '47 2-22/4 * * *'
  workflow_dispatch:
permissions:
  # Session 96fbe295: the last step publishes the verified build into the branch root,
  # which is what the legacy Pages builder republishes on every push to main.
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  # Session 96fbe295. GitHub cancels a *pending* run as soon as a newer run enters
  # the same concurrency group, even with cancel-in-progress: false (that flag only
  # governs the run that is already in progress). While sessions were pushing main
  # every few minutes on 2026-10-22, the four-hour refresh therefore never started:
  # runs 39748026849 (08:28:46Z), 39748055891 (08:29:00Z), 39750182735 (08:45:50Z)
  # and 39751657137 (08:57:20Z) were each cancelled while still pending, seconds
  # after the next push created a run. The last successful publish was 05:41Z and
  # the public site stayed on the 15 October root.
  # docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
  # Pushes and scheduled refreshes now use separate groups, so a push can never
  # cancel the four-hour guarantee. Push-triggered runs still serialise among
  # themselves, and a burst of pushes only costs the intermediate push runs.
  # Recovery and the existing catch-up slot use an available independent pool.
  # Normal four-hour/push behavior is unchanged; every validation still runs.
  group: pages-${{ (startsWith(github.event.head_commit.message, 'recovery:') || github.event.schedule == '47 2-22/4 * * *') && 'recovery' || github.event_name }}
  cancel-in-progress: false
jobs:
  # A push to main also starts the platform's *legacy* Pages build, which
  # publishes the checked-in branch root — `data/latest.json` generated
  # 2026-10-15T08:36:13Z — and it lands in well under a minute, while this
  # workflow needs about ten minutes to collect, replay and rebuild. Verified
  # 2026-10-22T01:20Z-01:32Z: eleven minutes after PR #146 merged, the public
  # /data/latest.json still reported 15 October, 80 records and 17 upcoming
  # (`data/research/416d93ee/verification.md`, read at 01:30:26Z). A reader who
  # opens the site in that window sees six-day-old matches and no current picks.
  # This job republishes the previous run's already-verified artifact straight
  # away, so the site never goes backwards while the fresh snapshot is built.
  # It is best-effort: if it fails, the publisher below still runs (`always()`)
  # and publishes the fresh snapshot exactly as before.
  republish-last-verified:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ (startsWith(github.event.head_commit.message, 'recovery:') || github.event.schedule == '47 2-22/4 * * *') && 'macos-14' || 'ubuntu-24.04' }}
    timeout-minutes: 12
    # Only this small job may retire verified obsolete main publishers. The
    # fresh publisher retains actions:read and all its original source guards.
    permissions:
      contents: read
      actions: write
      pages: write
      id-token: write
    outputs:
      queue_safe: ${{ steps.retire.outputs.safe }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The republish guard needs the publisher code, and this job otherwise only
      # downloads a previous artifact. Check out just scripts/ FIRST: checkout
      # runs `git clean -ffdx` in the workspace, so doing it after the artifact is
      # extracted would delete site/.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        if: (startsWith(github.event.head_commit.message, 'recovery:') || github.event.schedule == '47 2-22/4 * * *')
        with:
          python-version: '3.12'
      - name: Install the guard's only dependency
        run: python3 -m pip install --quiet requests==2.32.5
      - name: Retire only publishers predating independently replayable sources
        id: retire
        if: (startsWith(github.event.head_commit.message, 'recovery:') || github.event.schedule == '47 2-22/4 * * *')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 -m scripts.be019782_release --clear-obsolete
      # Recovery must publish newly collected evidence, not an old-code interim
      # artifact. This optional fallback is unchanged for ordinary refreshes.
      - name: Find the most recent successful publish
        if: ${{ !(startsWith(github.event.head_commit.message, 'recovery:') || github.event.schedule == '47 2-22/4 * * *') }}
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/pages.yml/runs?status=success&per_page=20" \
            --jq "[.workflow_runs[] | select(.id != ($CURRENT_RUN | tonumber))][0].id")
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::warning::No previous successful publish is available to republish; the fresh snapshot will publish normally."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download that run's verified artifact
        if: steps.previous.outputs.skip == 'false'
        uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: previous
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract it and refuse anything that is not a full site
        if: steps.previous.outputs.skip == 'false'
        run: |
          mkdir -p site && tar -xf previous/artifact.tar -C site
          test -f site/index.html
          test -f site/data/latest.json
          python3 - <<'PY'
          import json
          snapshot = json.load(open('site/data/latest.json'))
          print('republishing snapshot generated_at', snapshot['generated_at'], snapshot['counts'])
          PY
      # Never republish an artifact that is older than what the public site
      # already serves. On 2026-10-23 the six most recent scheduled runs had
      # failed at their regression step, so the newest *successful* publish was
      # from the previous day: this job would have restored a day-old snapshot
      # over a fresher live one. `--refuse-if-older-than-live` exits 3 in that
      # case and the step below is skipped, so the live site is left untouched
      # and the fresh build still publishes normally.
      - name: Check the last verified build is not older than the live site
        id: guard
        if: steps.previous.outputs.skip == 'false'
        run: |
          if python3 -m scripts.root_publish --output site --refuse-if-older-than-live; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "$code" -eq 3 ]; then
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Republish skipped::the saved build is older than the live snapshot"
            else
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              echo "::warning::republish guard exited $code; letting the republish proceed"
            fi
          fi
      - uses: actions/configure-pages@v6
        if: steps.previous.outputs.skip == 'false' && steps.guard.outputs.proceed == 'true'
      - id: upload
        uses: actions/upload-pages-artifact@v5
        if: steps.previous.outputs.skip == 'false' && steps.guard.outputs.proceed == 'true'
        with:
          name: github-pages-interim
          path: site
      - id: deployment
        if: steps.previous.outputs.skip == 'false' && steps.guard.outputs.proceed == 'true'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-interim
      # deploy-pages refuses to publish while a run holds two artifacts named
      # github-pages ("Artifact count is 2", observed on run 39713153422 for
      # 2026-10-22T03:10Z). Using `github-pages-interim` isolates the interim
      # artifact name without needing `actions: write`, and best-effort cleanup
      # removes it after deployment returns.
      - name: Remove the republished artifact before the fresh publish
        if: always() && steps.previous.outputs.skip == 'false' && steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::warning::No artifact id was reported; interim artifact uses distinct name github-pages-interim."
            exit 0
          fi
          gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID" \
            || echo "::warning::Could not delete interim artifact; distinct artifact_name prevents collision."
  verify-and-deploy:
    needs: [republish-last-verified]
    # Runs even when the fast republish failed: a broken helper must never stop
    # the fresh, fully validated snapshot from being published. An intentional
    # workflow cancellation must still stop this job, unlike bare always().
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && (!(startsWith(github.event.head_commit.message, 'recovery:') || github.event.schedule == '47 2-22/4 * * *') || needs['republish-last-verified'].outputs.queue_safe == 'true')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ (startsWith(github.event.head_commit.message, 'recovery:') || github.event.schedule == '47 2-22/4 * * *') && 'macos-14' || 'ubuntu-24.04' }}
    # The code-check job allows 45 minutes for regression/build/browser checks.
    # This publisher also collects fresh sources and verifies both Pages/root
    # publication. Keep 15 minutes of headroom; every test and source gate still
    # runs and a nonzero regression status still aborts publication.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # Regression tests validate the code against the repository's own fixture
      # snapshot, so they run BEFORE any cached runtime data is restored. Several
      # tests (e.g. tests/test_contrarian.py) are tied to the checked-in snapshot;
      # once the cache restore started hitting (identical path lists), running them
      # after the restore failed the 17983a6 deploy (run 38821346854).
      - name: Regression tests (repository fixtures, before any cache restore)
        # Mirror checks.yml: publish unittest FAIL/ERROR lines as ::error
        # annotations. Runs 39371739014 and 39389855311 (2026-10-20) failed here
        # with only "exit code 1" in the official annotations (run logs sit on a
        # host that restricted sandboxes cannot fetch), and the four SourceError
        # lines that appeared instead are synthetic output of patched tests in
        # tests/test_domain.py. A failing step must name its own failing test.
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee unittest-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '## unittest failures'
              echo '```'
              grep -E "^(FAIL|ERROR):|^Ran |^FAILED|^OK" unittest-output.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "^(FAIL|ERROR):" unittest-output.log | while IFS= read -r line; do
              echo "::error title=unittest::${line}"
            done
          fi
          exit "$status"
      # v2 isolates the new HLTV original-markup/format evidence contract.
      # Restoring v1 over this checkout mixes incompatible derived records and
      # leaves newer evidence files behind; never relabel that overlay verified.
      # The restore path list must be byte-identical (same entries, same order) to
      # the save step below: actions/cache derives the cache version from it, so a
      # different list can never match a saved snapshot. Restoring only
      # data/origination/evidence/ (never data/origination/) also keeps the
      # reviewed alias registry, aliases.json, out of every cache overlay.
      - name: Restore last successfully verified public snapshot
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: |
            data/latest.json
            data/sources.json
            data/origination.json
            data/evidence/
            data/origination/evidence/
          key: cs2-verified-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cs2-verified-v2-
      # Keep the exact snapshot pair (featured + originated) that was live
      # before this run touches anything. If freshly collected evidence fails
      # the full replay below, the site republishes this verified pair with
      # its original timestamps and stale warnings instead of going dark:
      # scheduled runs 38742696250 and 38797535468 (2026-10-15) failed at the
      # build step and left the public site frozen while this fallback did
      # not exist.
      # TWC originals have a separate cache contract so adding them cannot
      # invalidate the already verified inventory/origination v2 cache.
      - name: Restore last successfully verified TWC source snapshot
        id: restore-twc
        uses: actions/cache/restore@v6
        with:
          path: data/research/twc-current/
          key: twc-verified-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: twc-verified-v1-
      - name: Preserve last-good snapshot pair for in-run fallback
        run: |
          mkdir -p "$RUNNER_TEMP/last-good/data/research"
          cp data/latest.json data/sources.json "$RUNNER_TEMP/last-good/data/"
          cp data/origination.json "$RUNNER_TEMP/last-good/data/" 2>/dev/null || true
          cp -r data/evidence "$RUNNER_TEMP/last-good/data/evidence"
          cp -r data/origination "$RUNNER_TEMP/last-good/data/origination" 2>/dev/null || true
          cp -r data/research/twc-current "$RUNNER_TEMP/last-good/data/research/twc-current" 2>/dev/null || true
      - name: Refresh all Hotspawn CS2 records and supported external lines
        env:
          # Authenticated GitHub API calls: the shared unauthenticated quota (60/h) is routinely exhausted on runners.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.collect
      - name: Research only unresolved fixture picks using first-party lines
        env:
          # Authenticated GitHub API calls: the shared unauthenticated quota (60/h) is routinely exhausted on runners.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.originate --live
      - name: Document why every blank pick stayed blank (leads only, never prices)
        # The dossier is evidence-linked and non-fatal: a probe outage must never block a refresh, and the
        # script writes no probability, no pick and no alias — it only explains each blank and lists the
        # provider listing a reviewed alias could close. Reachability probes for five books run live here so
        # the record reflects the runner's own egress rather than a developer machine.
        run: |
          if python -m scripts.coverage_probe --live; then
            echo "ok"
          else
            echo "::warning::coverage probe failed; unresolved sections keep the collector's own reasons"
          fi
      - name: Record which line sources actually answered this refresh (read-only, non-fatal)
        # Session fbdc97d6: the executive summary publishes this sweep beside the
        # unresolved register so the source limitations are dated and reviewable.
        # It writes status codes and notes only - never a probability, a pick or
        # an alias - and a failure keeps the previous dated record.
        run: |
          if python -m scripts.fbdc97d6_probe --timeout 10 --out data/research/fbdc97d6; then
            echo "line-source sweep recorded"
          else
            echo "::warning::line-source sweep failed; the register keeps the last dated record"
          fi
      - name: Refresh dated TWC Day-3 results, Day-4 and Day-5 research (no pricing override)
        run: python -m scripts.twc_research
      - name: Order platform publishers and record Pages configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.publication
      - name: Reconcile every row, replay every probability and build linked pages
        id: build
        run: |
          run_build() {
            BUILD_ATTEMPT="$1" python - <<'PY'
          import os, traceback
          from pathlib import Path
          from scripts.build import build
          try:
              build(Path('data'), Path('site'))
          except Exception as exc:
              frames = traceback.extract_tb(exc.__traceback__)
              where = ' > '.join(f'{Path(f.filename).name}:{f.lineno}:{f.name}' for f in frames[-8:])
              detail = f'{type(exc).__name__}: {exc} @ {where}'.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              attempt = os.environ.get('BUILD_ATTEMPT', 'unknown')
              print(f'::error title={attempt} snapshot build failed::{detail}')
              raise
          PY
          }
          if run_build fresh; then
            echo "degraded=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Fresh snapshot failed full replay validation; republishing the last verified snapshot pair (original timestamps and stale warnings preserved). No probability was repaired or invented."
            {
              echo '## Publisher fallback engaged'
              echo ''
              echo 'The freshly collected snapshot failed `scripts.build` replay validation.'
              echo 'The last verified snapshot pair was restored unchanged and rebuilt instead;'
              echo 'its original observation timestamps and stale warnings remain visible on the site.'
            } >> "$GITHUB_STEP_SUMMARY"
            rm -rf site data/evidence data/origination data/research/twc-current
            cp "$RUNNER_TEMP/last-good/data/latest.json" "$RUNNER_TEMP/last-good/data/sources.json" data/
            cp "$RUNNER_TEMP/last-good/data/origination.json" data/ 2>/dev/null || true
            cp -r "$RUNNER_TEMP/last-good/data/evidence" data/evidence
            cp -r "$RUNNER_TEMP/last-good/data/origination" data/origination 2>/dev/null || true
            cp -r "$RUNNER_TEMP/last-good/data/research/twc-current" data/research/twc-current 2>/dev/null || true
            run_build last-good
            echo "degraded=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Inspect source freshness for cache eligibility
        id: snapshot
        run: |
          python - <<'PY'
          import json, os
          d = json.load(open('data/latest.json'))
          degraded = '${{ steps.build.outputs.degraded }}' == 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              # A fallback republication must never become the cached
              # "verified" snapshot for the next run.
              f.write('inventory_ok=' + str(d['coverage_complete'] and not degraded).lower() + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Public-source CS2 snapshot\n\n')
              f.write('Inventory observed: ' + str(d['inventory_observed_at']) + '\n\n')
              f.write('Counts: `' + json.dumps(d['counts']) + '`\n\n')
              f.write('State: ' + d['run_status'] + '. Source limitations and unresolved picks are published on the review page.\n')
          PY
      - name: Preserve verified evidence for a future source outage
        if: steps.snapshot.outputs.inventory_ok == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            data/latest.json
            data/sources.json
            data/origination.json
            data/evidence/
            data/origination/evidence/
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - name: Preserve verified TWC originals and line-movement history
        if: steps.snapshot.outputs.inventory_ok == 'true'
        uses: actions/cache/save@v6
        with:
          path: data/research/twc-current/
          key: ${{ steps.restore-twc.outputs.cache-primary-key }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the public site, its complete data and category pages
        run: python -m scripts.verify_live --url '${{ steps.deployment.outputs.page_url }}'
      # The repository's Pages site is still configured in the platform's legacy
      # build mode (the configuration API answers HTTP 403 to this workflow's
      # token). A push-triggered legacy build publishes the checked-in branch root
      # and can land AFTER this workflow's artifact deployment, temporarily
      # replacing current picks with the older checked-in pages. Observed on
      # 2026-10-21: the deployment at 20:01:21Z served the 15 October root pages
      # while this workflow's deployment for the same commit was still queued.
      # Re-read the public snapshot once the window has passed; if the platform
      # overwrote it, publish the verified artifact again and re-verify.
      - name: Re-read the public snapshot after the legacy-publisher window
        id: guard
        continue-on-error: true
        run: |
          sleep 75
          python -m scripts.verify_live --url '${{ steps.deployment.outputs.page_url }}'
      - name: Republish the verified artifact if a legacy build overwrote it
        id: republish
        if: steps.guard.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - name: Verify the republished site
        if: steps.guard.outcome == 'failure'
        run: python -m scripts.verify_live --url '${{ steps.deployment.outputs.page_url }}'

      # Session 96fbe295. `GET /repos/.../pages` reports build_type "legacy" and
      # source main//, so every push to main makes the platform republish the
      # checked-in branch root. On 2026-10-22 that legacy build for 2fb99b0 finished
      # 07:52:31Z, i.e. after this workflow's previous artifact, and the public
      # data/latest.json then read generated_at 2026-10-15T08:36:13Z: seventeen
      # fixtures whose start times were already a week in the past. The site's own
      # data/row-source-audit.json was byte-identical to the tracked file, proving
      # the served site was the branch root, not the artifact.
      # `PUT /pages {build_type: workflow}` answers 403 Resource not accessible by
      # integration, so the source cannot be switched from a workflow token. The
      # race is therefore closed from the side this repository controls: publish the
      # build that this run just verified into the root as well. Both publishers then
      # serve the same, current site, and the root keeps the newest snapshot forever
      # because scripts/root_publish.py refuses to move backwards or to publish a
      # snapshot older than twelve hours.
      # `[skip ci]` stops the commit from starting another workflow run; when a commit
      # is pushed, GitHub's legacy Pages build runs for that push (~30s). We wait for
      # that legacy build to complete (`--wait-legacy-sha`) and re-deploy the verified
      # `github-pages` artifact so the live site serves BOTH current HTML pages in the
      # branch root AND the complete fresh `data/` + evidence tree from the artifact.
      - name: Publish the verified build into the branch root (the legacy Pages source)
        id: root_sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -m scripts.root_publish --output site --root . --paths-file "$RUNNER_TEMP/root-paths.txt"
          if [ ! -s "$RUNNER_TEMP/root-paths.txt" ]; then
            echo "Branch root already matches this verified build; nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # Re-point the checkout at the newest main without touching working-tree
            # files, re-stage exactly the published paths, and commit again. Re-doing
            # the sync is safe: the copy is byte-for-byte idempotent.
            git fetch --depth=1 origin main
            git reset --mixed FETCH_HEAD
            git add --pathspec-from-file="$RUNNER_TEMP/root-paths.txt"
            if git diff --cached --quiet; then
              echo "Nothing staged after reconciling with main." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git commit -m 'publish: sync the verified build into the branch root [skip ci]'
            if git push origin HEAD:main; then
              pushed_sha="$(git rev-parse HEAD)"
              echo "pushed_sha=$pushed_sha" >> "$GITHUB_OUTPUT"
              echo "Published $(wc -l < "$RUNNER_TEMP/root-paths.txt") file(s) from this verified build into the branch root ($pushed_sha, attempt $attempt)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::root publish push attempt $attempt lost the race to another commit; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::the verified build could not be published into the branch root in three attempts"
          exit 1
      - name: Wait for the root-sync commit's legacy Pages build
        if: steps.root_sync.outputs.pushed_sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m scripts.root_publish --wait-legacy-sha "${{ steps.root_sync.outputs.pushed_sha }}"
      - name: Re-deploy the verified artifact over the legacy root build
        if: steps.root_sync.outputs.pushed_sha != ''
        uses: actions/deploy-pages@v5
      - name: Verify the public site after root-sync re-deploy
        if: steps.root_sync.outputs.pushed_sha != ''
        run: python -m scripts.verify_live --url '${{ steps.deployment.outputs.page_url }}'
