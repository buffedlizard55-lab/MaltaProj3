name: Refresh and deploy CS2 dashboard
on:
  push:
    branches: [main]
  schedule:
    # Primary four-hour refresh, off the top of the hour.
    - cron: '17 */4 * * *'
    # Catch-up slot two and a half hours later. GitHub delays or drops scheduled
    # runs under load (on 2026-10-15 only 04:39, 13:26 and 19:53 UTC ran: an
    # 8.8-hour gap). With this offset, one dropped slot still leaves a refresh
    # within about four hours, keeping the published data inside the 8-hour bound.
    - cron: '47 2-22/4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  # The same group covers pushes and scheduled refreshes: no competing publishers.
  group: pages
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # Regression tests validate the code against the repository's own fixture
      # snapshot, so they run BEFORE any cached runtime data is restored. Several
      # tests (e.g. tests/test_contrarian.py) are tied to the checked-in snapshot;
      # once the cache restore started hitting (identical path lists), running them
      # after the restore failed the 17983a6 deploy (run 38821346854).
      - name: Regression tests (repository fixtures, before any cache restore)
        run: python -m unittest discover -s tests -v
      # v2 isolates the new HLTV original-markup/format evidence contract.
      # Restoring v1 over this checkout mixes incompatible derived records and
      # leaves newer evidence files behind; never relabel that overlay verified.
      # The restore path list must be byte-identical (same entries, same order) to
      # the save step below: actions/cache derives the cache version from it, so a
      # different list can never match a saved snapshot. Restoring only
      # data/origination/evidence/ (never data/origination/) also keeps the
      # reviewed alias registry, aliases.json, out of every cache overlay.
      - name: Restore last successfully verified public snapshot
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: |
            data/latest.json
            data/sources.json
            data/origination.json
            data/evidence/
            data/origination/evidence/
          key: cs2-verified-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cs2-verified-v2-
      # Keep the exact snapshot pair (featured + originated) that was live
      # before this run touches anything. If freshly collected evidence fails
      # the full replay below, the site republishes this verified pair with
      # its original timestamps and stale warnings instead of going dark:
      # scheduled runs 38742696250 and 38797535468 (2026-10-15) failed at the
      # build step and left the public site frozen while this fallback did
      # not exist.
      # TWC originals have a separate cache contract so adding them cannot
      # invalidate the already verified inventory/origination v2 cache.
      - name: Restore last successfully verified TWC source snapshot
        id: restore-twc
        uses: actions/cache/restore@v6
        with:
          path: data/research/twc-current/
          key: twc-verified-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: twc-verified-v1-
      - name: Preserve last-good snapshot pair for in-run fallback
        run: |
          mkdir -p "$RUNNER_TEMP/last-good/data/research"
          cp data/latest.json data/sources.json "$RUNNER_TEMP/last-good/data/"
          cp data/origination.json "$RUNNER_TEMP/last-good/data/" 2>/dev/null || true
          cp -r data/evidence "$RUNNER_TEMP/last-good/data/evidence"
          cp -r data/origination "$RUNNER_TEMP/last-good/data/origination" 2>/dev/null || true
          cp -r data/research/twc-current "$RUNNER_TEMP/last-good/data/research/twc-current" 2>/dev/null || true
      - name: Refresh all Hotspawn CS2 records and supported external lines
        env:
          # Authenticated GitHub API calls: the shared unauthenticated quota (60/h) is routinely exhausted on runners.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.collect
      - name: Research only unresolved fixture picks using first-party lines
        env:
          # Authenticated GitHub API calls: the shared unauthenticated quota (60/h) is routinely exhausted on runners.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.originate --live
      - name: Refresh dated TWC Day-3 results and Day-4 research (no pricing override)
        run: python -m scripts.twc_research
      - name: Order platform publishers and record Pages configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.publication
      - name: Reconcile every row, replay every probability and build linked pages
        id: build
        run: |
          run_build() {
            BUILD_ATTEMPT="$1" python - <<'PY'
          import os, traceback
          from pathlib import Path
          from scripts.build import build
          try:
              build(Path('data'), Path('site'))
          except Exception as exc:
              frames = traceback.extract_tb(exc.__traceback__)
              where = ' > '.join(f'{Path(f.filename).name}:{f.lineno}:{f.name}' for f in frames[-8:])
              detail = f'{type(exc).__name__}: {exc} @ {where}'.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              attempt = os.environ.get('BUILD_ATTEMPT', 'unknown')
              print(f'::error title={attempt} snapshot build failed::{detail}')
              raise
          PY
          }
          if run_build fresh; then
            echo "degraded=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Fresh snapshot failed full replay validation; republishing the last verified snapshot pair (original timestamps and stale warnings preserved). No probability was repaired or invented."
            {
              echo '## Publisher fallback engaged'
              echo ''
              echo 'The freshly collected snapshot failed `scripts.build` replay validation.'
              echo 'The last verified snapshot pair was restored unchanged and rebuilt instead;'
              echo 'its original observation timestamps and stale warnings remain visible on the site.'
            } >> "$GITHUB_STEP_SUMMARY"
            rm -rf site data/evidence data/origination data/research/twc-current
            cp "$RUNNER_TEMP/last-good/data/latest.json" "$RUNNER_TEMP/last-good/data/sources.json" data/
            cp "$RUNNER_TEMP/last-good/data/origination.json" data/ 2>/dev/null || true
            cp -r "$RUNNER_TEMP/last-good/data/evidence" data/evidence
            cp -r "$RUNNER_TEMP/last-good/data/origination" data/origination 2>/dev/null || true
            cp -r "$RUNNER_TEMP/last-good/data/research/twc-current" data/research/twc-current 2>/dev/null || true
            run_build last-good
            echo "degraded=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Inspect source freshness for cache eligibility
        id: snapshot
        run: |
          python - <<'PY'
          import json, os
          d = json.load(open('data/latest.json'))
          degraded = '${{ steps.build.outputs.degraded }}' == 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              # A fallback republication must never become the cached
              # "verified" snapshot for the next run.
              f.write('inventory_ok=' + str(d['coverage_complete'] and not degraded).lower() + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Public-source CS2 snapshot\n\n')
              f.write('Inventory observed: ' + str(d['inventory_observed_at']) + '\n\n')
              f.write('Counts: `' + json.dumps(d['counts']) + '`\n\n')
              f.write('State: ' + d['run_status'] + '. Source limitations and unresolved picks are published on the review page.\n')
          PY
      - name: Preserve verified evidence for a future source outage
        if: steps.snapshot.outputs.inventory_ok == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            data/latest.json
            data/sources.json
            data/origination.json
            data/evidence/
            data/origination/evidence/
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - name: Preserve verified TWC originals and line-movement history
        if: steps.snapshot.outputs.inventory_ok == 'true'
        uses: actions/cache/save@v6
        with:
          path: data/research/twc-current/
          key: ${{ steps.restore-twc.outputs.cache-primary-key }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the public site, its complete data and category pages
        run: python -m scripts.verify_live --url '${{ steps.deployment.outputs.page_url }}'
