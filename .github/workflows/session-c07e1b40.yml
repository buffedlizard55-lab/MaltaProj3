name: Session c07e1b40 evidence collector
# Branch-only research collector for session c07e1b40. It runs the same collection
# commands as production on a GitHub runner (the session sandbox cannot reach the
# source hosts), probes extra public line sources, and commits a compressed bundle
# into data/research/c07e1b40/live/ on this session branch ONLY. It never deploys,
# never writes shared outputs, and is not a second scheduled publisher.
on:
  push:
    branches: [arena/c07e1b40-maltaproj3]
    paths:
      - 'scripts/originate.py'
      - 'scripts/research_lines.py'
      - 'scripts/build_origination.py'
      - 'data/origination/aliases.json'
      - '.github/workflows/session-c07e1b40.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: session-c07e1b40-collect
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/arena/c07e1b40-maltaproj3'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect canonical inventory (same command as production)
        run: python -m scripts.collect
      - name: Originate fallback picks from live first-party sources
        run: python -m scripts.originate --live
      - name: Probe additional public line sources (research only)
        run: python -m scripts.research_lines
      - name: Build and capture any traceback as an annotation
        run: |
          python - <<'PY'
          import traceback
          from pathlib import Path
          from scripts.build import build
          try:
              build(Path('data'), Path('site'))
              print('::notice title=build::build OK')
          except Exception:
              tb = traceback.format_exc()
              Path('.cache/research').mkdir(parents=True, exist_ok=True)
              Path('.cache/research/build-traceback.txt').write_text(tb)
              print('::error title=build traceback::' + tb[-3500:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - name: Export bundle to this session branch only
        run: |
          set -e
          tar -czf /tmp/snapshot.tar.gz data/latest.json data/origination.json data/sources.json data/evidence data/origination/evidence .cache/research
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset -q --hard HEAD
          git clean -fdq
          for attempt in 1 2 3; do
            git pull -q --rebase origin arena/c07e1b40-maltaproj3
            mkdir -p data/research/c07e1b40/live
            cp /tmp/snapshot.tar.gz data/research/c07e1b40/live/snapshot.tar.gz
            git add data/research/c07e1b40/live/snapshot.tar.gz
            git diff --cached --quiet && exit 0
            git commit -q -m "research(c07e1b40): runner evidence bundle ${GITHUB_RUN_ID}"
            if git push -q origin HEAD:arena/c07e1b40-maltaproj3; then exit 0; fi
            git reset -q --hard HEAD~1
            sleep 5
          done
          exit 1
