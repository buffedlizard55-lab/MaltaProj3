# Session arena-75de2710 — read-only live release audit and unresolved-pick probe.
#
# The coding sandbox has no egress to Hotspawn, HLTV or bookmakers; the GitHub
# runner does. This workflow never deploys and never rewrites a published
# dataset. It audits the deployed Pages release, reconciles the live Hotspawn
# inventory against it, probes HLTV (match, team and ranking pages) and the
# esportsbook endpoints for every fixture the published ladder left blank, and
# commits only the dated report and hashed originals.
#
# The guarded push trigger skips the workflow's own report commit, so a report
# push can never re-trigger the probe in a loop.
name: 75de2710 live audit and unresolved-pick probe (never deploys)
on:
  workflow_dispatch:
  push:
    branches: ['arena/75de2710-maltaproj3']
permissions:
  contents: write
concurrency:
  group: s75de2710-probe
  cancel-in-progress: true
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'research(75de2710)')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the read-only probe
        run: python -m scripts.s75de2710_probe --live
      - name: Commit the dated report and hashed originals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/75de2710/
          git diff --cached --quiet && echo 'no report change' && exit 0
          git commit -m 'research(75de2710): live release audit and unresolved-pick source probe'
          git pull --rebase origin arena/75de2710-maltaproj3
          git push origin arena/75de2710-maltaproj3
