name: Session 1112299f GitHub API rate-limit probe
# Diagnostic only: two read-only GETs of a public Valve directory listing, annotated with the rate-limit headers.
on:
  push:
    branches: [arena/1112299f-maltaproj3]
    paths: ['.github/workflows/session-1112299f-ratelimit-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Unauthenticated, as the collectors do today
        run: |
          url='https://api.github.com/repos/ValveSoftware/counter-strike_regional_standings/contents/live/2026'
          for i in 1 2 3; do
            curl -s -o /dev/null -D /tmp/h.txt -w '%{http_code}' "$url" > /tmp/code.txt
            echo "::notice title=unauthenticated try $i::HTTP $(cat /tmp/code.txt) $(grep -iE '^(x-ratelimit-(limit|remaining|used|resource)):' /tmp/h.txt | tr -d '\r' | tr '\n' ' ')"
            sleep 2
          done
      - name: Authenticated with the workflow token (no secret is printed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url='https://api.github.com/repos/ValveSoftware/counter-strike_regional_standings/contents/live/2026'
          curl -s -o /dev/null -D /tmp/h.txt -w '%{http_code}' -H "Authorization: Bearer $GITHUB_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$url" > /tmp/code.txt
          echo "::notice title=authenticated::HTTP $(cat /tmp/code.txt) $(grep -iE '^(x-ratelimit-(limit|remaining|used|resource)):' /tmp/h.txt | tr -d '\r' | tr '\n' ' ')"
