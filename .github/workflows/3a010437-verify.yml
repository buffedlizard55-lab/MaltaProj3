# Session arena-3a010437 — independent re-read of the *published* picks.
#
# The coding sandbox cannot reach Hotspawn, Polymarket, HLTV or a bookmaker; a
# GitHub runner can. This workflow audits what the public site actually serves:
#
#   1. downloads the deployed data/latest.json + data/origination.json;
#   2. re-reads every active row against the original source that row cites
#      (Hotspawn match page for identity, the row's own Polymarket event
#      endpoint or cited URL for the price) — scripts/3a010437_verify.py;
#   3. compares the audited snapshot with the live Hotspawn fixture API and
#      records any fixture the snapshot does not contain;
#   4. commits ONLY the dated report under data/research/3a010437/.
#
# It never edits a pick, a probability, an alias or a deployed file, and it
# never triggers a deploy. The push guard skips this workflow's own commit so
# the report cannot loop.
name: 3a010437 published-pick verification (never deploys)
on:
  workflow_dispatch:
  push:
    branches: ['arena/3a010437-maltaproj3']
permissions:
  contents: write
concurrency:
  group: 3a010437-verify
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'research(3a010437)')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Re-read every published row against the source it cites
        run: python -m scripts.3a010437_verify --published --out data/research/3a010437
      - name: Refuse to commit a report without rows
        run: |
          python - <<'PY'
          import json
          report = json.load(open('data/research/3a010437/verification.json'))
          rows = report.get('rows') or []
          assert rows, 'verification report has no rows'
          print('verified rows:', len(rows), report['totals'])
          PY
      - name: Commit the dated report to this session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/3a010437/
          if git diff --cached --quiet; then echo 'no report change'; exit 0; fi
          git commit -m 'research(3a010437): independent re-read of every published pick (never published to the site)'
          git pull --rebase origin arena/3a010437-maltaproj3
          git push origin arena/3a010437-maltaproj3
