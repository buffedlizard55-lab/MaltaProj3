name: EE27 read-only line-source probe (session only)
# Session ee27e097 only. Removed before the merge; it exists so the runner's real
# network access to esportsbook/aggregator surfaces can be observed and kept as
# dated evidence instead of being asserted from a sandbox with no network.
on:
  # A workflow added on a non-default branch is not dispatchable through the API
  # until it exists on main, so this branch-scoped probe is triggered by a push
  # that touches the trigger file only. The evidence commit it makes does not
  # match the path filter and therefore cannot loop.
  push:
    branches: [arena/ee27e097-maltaproj3]
    paths:
      - 'data/research/ee27e097/trigger.txt'
      - '.github/workflows/ee27e097-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arena/ee27e097-maltaproj3
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt playwright
      - name: Install Chromium for the browser probe
        run: python -m playwright install --with-deps chromium
      - name: Run the probe
        run: |
          python -m scripts.ee27e097_probe --out data/research/ee27e097 --browser
      - name: Commit and push the evidence to this branch
        run: |
          git config user.name "arena-ee27e097"
          git config user.email "arena@users.noreply.github.com"
          git add data/research/ee27e097
          git commit -m "research(ee27e097): runner line-source probe $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no change"
          git pull --rebase origin arena/ee27e097-maltaproj3
          git push origin HEAD:arena/ee27e097-maltaproj3
