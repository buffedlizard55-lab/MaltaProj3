name: 1fb85c47 network contract check (diagnostic)

on:
  workflow_dispatch:
  push:
    branches: [arena/1fb85c47-maltaproj3]
    paths:
      - '.github/workflows/1fb85c47-netcheck.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe HLTV and bookmaker transports with explicit header sets
        run: |
          set -u
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          probe () {
            label="$1"; shift
            code=$(curl -sS -L --max-time 25 -o /tmp/body -w '%{http_code}' "$@" || echo ERR)
            size=$(wc -c </tmp/body 2>/dev/null || echo 0)
            printf '%-34s %s %s bytes\n' "$label" "$code" "$size"
            head -c 220 /tmp/body | tr -d '\r' | tr '\n' ' '; echo
            echo '---'
          }
          H=(-H "User-Agent: $UA" -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' -H 'Accept-Language: en-US,en;q=0.9')
          probe 'hltv-team-default'      'https://www.hltv.org/team/14100/ex-6666'
          probe 'hltv-team-browser'      "${H[@]}" 'https://www.hltv.org/team/14100/ex-6666'
          probe 'hltv-team-referer'      "${H[@]}" -H 'Referer: https://www.hltv.org/' -H 'Sec-Fetch-Site: same-origin' -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Dest: document' -H 'Upgrade-Insecure-Requests: 1' 'https://www.hltv.org/team/14100/ex-6666'
          probe 'hltv-ranking-browser'   "${H[@]}" 'https://www.hltv.org/ranking/teams/2026/october/19'
          probe 'hltv-valveranking-browser' "${H[@]}" 'https://www.hltv.org/valve-ranking/teams/2026/october/19/region/Europe'
          probe 'hltv-match-browser'     "${H[@]}" 'https://www.hltv.org/matches/2399578/chinggis-warriors-vs-wxm-macemedia-void-autumn-cup-2026'
          probe 'hltv-api-matches'       "${H[@]}" -H 'Accept: application/json' 'https://www.hltv.org/api/matches'
          probe '1xbet-1x2-json'         -H 'User-Agent: Mozilla/5.0' -H 'Accept: application/json' 'https://1xbet.com/LineFeed/Get1x2_VZip?sports=3&count=50&lng=en&mode=4&country=1&partner=51&getEmpty=true'
          probe '1xbet-1x2-service'      -H 'User-Agent: Mozilla/5.0' -H 'Accept: application/json' 'https://1xbet.com/service-api/LineFeed/Get1x2_VZip?sports=3&count=50&lng=en&mode=4&country=1&partner=51&getEmpty=true'
          probe '1xbet-sports-short'     -H 'User-Agent: Mozilla/5.0' -H 'Accept: application/json' 'https://1xbet.com/LineFeed/GetSportsShortZip?sports=3&lng=en&country=1&partner=51'
          probe 'bo3-matches-upcoming'   -H 'Accept: application/json' -H 'Origin: https://bo3.gg' -H 'Referer: https://bo3.gg/' 'https://api.bo3.gg/api/v1/matches?page%5Boffset%5D=0&page%5Blimit%5D=50&sort=start_date&filter%5Bmatches.status%5D%5Bin%5D=upcoming&filter%5Bmatches.discipline_id%5D%5Beq%5D=1&with=teams,tournament,ai_predictions,games'
          probe 'bo3-match-slug'         -H 'Accept: application/json' -H 'Origin: https://bo3.gg' -H 'Referer: https://bo3.gg/' 'https://api.bo3.gg/api/v1/matches/chinggis-warriors-vs-wxm-20-10-2026?with=teams,tournament,ai_predictions,games'
          echo '== 1xbet raw head =='; curl -sS --max-time 25 'https://1xbet.com/LineFeed/Get1x2_VZip?sports=3&count=5&lng=en&mode=4&country=1&partner=51&getEmpty=true' | head -c 600; echo
