name: Verification research probe
# Independent, read-only first-party research for the verification/audit session
# (arena-ba7164a0). This sandbox has no general egress, so the probe runs on a
# GitHub runner and commits only its own evidence directory.
#
# Deliberately data-only: it never deploys, never edits another session's file and
# never computes a probability. `.github/workflows/pages.yml` remains the single
# Pages publisher, and no second scheduled writer is introduced.
on:
  push:
    branches: ['arena/ba7164a0-maltaproj3']
    paths:
      - 'scripts/research_verify.py'
      - '.github/workflows/verify-research.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ba7164a0-verification-research
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/arena/ba7164a0-maltaproj3'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Parser regression tests (offline, no network)
        run: python -m unittest tests.test_research_verify -v
      - name: Read official first-party sources and archive the original responses
        env:
          # Authenticated GitHub API calls: the shared unauthenticated quota is
          # routinely exhausted on runners, which would hide the Valve snapshot.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.research_verify --out data/research/ba7164a0
      - name: Summarise what was actually read
        run: |
          python - <<'PY'
          import json, os
          d = json.load(open('data/research/ba7164a0/observations.json'))
          log = d['requests']
          ok = [r for r in log if r['status'] == 'ok']
          bad = [r for r in log if r['status'] != 'ok']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'w') as f:
              f.write('## Independent verification probe\n\n')
              f.write(f"- Sources read successfully: **{len(ok)}**\n")
              f.write(f"- Sources not readable: **{len(bad)}**\n")
              f.write(f"- Polymarket CS2 series moneylines: **{len(d['polymarket']['moneylines'])}**\n")
              f.write(f"- Hotspawn CS2 fixtures: **{d['hotspawn'].get('count', 0)}**\n")
              f.write(f"- Valve rating rows found: **{len(d['valve'].get('ratings', {}))}**\n\n")
              if bad:
                  f.write('### Not readable (recorded as limitations, never guessed around)\n\n')
                  for r in bad[:40]:
                      f.write(f"- `{r['status']}` {r['label']} — {r.get('note', '')}\n")
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ba7164a0-verification-evidence
          path: data/research/ba7164a0/
          retention-days: 7
      - name: Commit the archived original evidence to this session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/ba7164a0
          git diff --cached --quiet && { echo 'No evidence change to commit.'; exit 0; }
          git commit -m 'research(ba7164a0): archive original first-party verification evidence'
          # Discard only this probe's own uncommitted runtime overlay if a step
          # rewrote it, then rebase so concurrent sessions' work is never lost.
          git checkout -- . 2>/dev/null || true
          git pull --rebase origin arena/ba7164a0-maltaproj3
          git push origin arena/ba7164a0-maltaproj3
