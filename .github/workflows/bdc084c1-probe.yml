# Session-scoped coverage probe for arena-bdc084c1.
#
# Why a workflow: the sandbox this session runs in cannot reach the official
# sources (Hotspawn's fixture API and lobby are blocked by the sandbox network
# policy), so the "does every fixture Hotspawn lists end up with a pick" question
# can only be answered from inside GitHub Actions, where the four-hour refresh
# already reads them. The probe itself (scripts/bdc084c1_probe.py) is read-only:
# it reads the fresh snapshot, the saved evidence and the published HTML and
# writes one report. It never writes data/latest.json, data/origination.json or
# any site page.
#
# This file is deleted again before the PR merges, like every other session's
# runner-scoped workflow.
name: bdc084c1 coverage probe

on:
  push:
    branches: ['arena/bdc084c1-maltaproj3']
    paths:
      - 'scripts/bdc084c1_probe.py'
      - '.github/workflows/bdc084c1-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bdc084c1-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --quiet -r requirements.txt
      - name: Collect the live inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.collect
      - name: Originate every pick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.originate --live
      - name: Probe coverage and basis
        run: python -m scripts.bdc084c1_probe --data data --report data/research/bdc084c1
      - name: Summarise
        if: always()
        run: cat data/research/bdc084c1/probe-report.md >> "$GITHUB_STEP_SUMMARY"
      # Job logs are not readable from this session's sandbox (the log blob host
      # is blocked), so the numbers that matter are published as annotations on
      # the run, which the GitHub API does return.
      - name: Annotate the coverage result
        if: always()
        run: |
          python - <<'PY'
          import json
          r = json.load(open('data/research/bdc084c1/probe-report.json'))
          a, fx, s = r['active'], r['fixtures'], r['fresh_snapshot']
          def names(rows):
              out = []
              for row in rows:
                  teams = [t.get('name') if isinstance(t, dict) else str(t) for t in row.get('teams') or []]
                  out.append(row.get('id', '?') + ' ' + ' vs '.join(teams))
              return '; '.join(out) or 'none'
          print('::notice title=fresh inventory::%s ids, cross-check %s, %s upcoming, captured %s' % (
              s['inventory'], s['inventory_crosscheck'], s['counts']['upcoming'], s['generated_at']))
          print('::notice title=coverage::%s active fixtures, %s with probabilities, %s with a pick, %s without a side' % (
              a['total'], a['with_probabilities'], a['with_pick'], len(a['without_pick'])))
          print('::notice title=basis::%s' % json.dumps(a['by_basis'], sort_keys=True))
          print('::notice title=sources::%s' % json.dumps(a['by_source_host'], sort_keys=True))
          print('::notice title=no side::%s' % names(a['without_pick']))
          print('::notice title=new since published::%s fixtures (%s active); %s fixtures no longer listed' % (
              len(fx['new_since_published']), fx['new_active'], len(fx['no_longer_listed'])))
          PY
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdc084c1-probe-report
          path: |
            data/research/bdc084c1/probe-report.json
            data/research/bdc084c1/probe-report.md
          if-no-files-found: warn
