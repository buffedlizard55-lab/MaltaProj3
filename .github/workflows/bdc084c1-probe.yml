name: bdc084c1 coverage probe (session-only)

# Read-only coverage probe for session arena-bdc084c1.
#
# It collects a fresh Hotspawn snapshot and runs the published origination ladder,
# but it NEVER publishes, never commits and never deploys. Its only output is an
# artifact plus a step summary, so the findings can be checked line by line.
# This file is removed before the session's PR is merged.
on:
  push:
    branches: ['arena/bdc084c1-maltaproj3']
    paths:
      - 'scripts/bdc084c1_probe.py'
      - '.github/workflows/bdc084c1-probe.yml'
  workflow_dispatch:
permissions:
  # Write is needed only to commit this session's own probe evidence
  # (data/research/bdc084c1/) back to the session branch. Nothing else is pushed.
  contents: write
concurrency:
  group: bdc084c1-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Record the published snapshot this run is compared against
        run: |
          mkdir -p data/research/bdc084c1
          git show HEAD:data/latest.json > data/research/bdc084c1/published-latest.json
          git show HEAD:data/origination.json > data/research/bdc084c1/published-origination.json 2>/dev/null || true
          python - <<'PY'
          import json
          d = json.load(open('data/research/bdc084c1/published-latest.json'))
          print('published snapshot', d['generated_at'], d['counts'])
          PY
      - name: Collect the live Hotspawn inventory and supported external lines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.collect
      - name: Run the published origination ladder (research rungs only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.originate --live
      - name: Compare the fresh snapshot with the published one, fixture by fixture
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.bdc084c1_probe --report data/research/bdc084c1
      - name: Publish the probe digest in the step summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path('data/research/bdc084c1/probe-report.json')
          print('## bdc084c1 coverage probe\n')
          if not p.exists():
              print('The probe did not produce a report; see the failing step above.')
              raise SystemExit(0)
          r = json.loads(p.read_text())
          print(f"- Published snapshot: `{r['published_snapshot']['generated_at']}` "
                f"({r['published_snapshot']['inventory']} inventory records)")
          print(f"- Fresh snapshot: `{r['fresh_snapshot']['generated_at']}` "
                f"({r['fresh_snapshot']['inventory']} inventory records, crosscheck "
                f"`{r['fresh_snapshot']['inventory_crosscheck']}`)")
          print(f"- New fixture ids since publication: {len(r['fixtures']['new_since_published'])} "
                f"({r['fixtures']['new_active']} active, {r['fixtures']['new_archived']} archived)")
          a = r['active']
          print(f"- Active fixtures: {a['total']}, with a pick: {a['with_pick']}, "
                f"with probabilities: {a['with_probabilities']}, from an external line: "
                f"{a['with_betting_line']}, research model only: {a['research_model_only']}")
          print(f"- Basis mix: `{json.dumps(a['by_basis'])}`")
          print(f"- Source hosts: `{json.dumps(a['by_source_host'])}`")
          if r['new_fixtures']:
              print('\n### Fixtures new since the published snapshot\n')
              print('| id | fixture | start (UTC) | state | basis | source |')
              print('| --- | --- | --- | --- | --- | --- |')
              for x in r['new_fixtures']:
                  state = 'pick ' + x['pick'] if x['pick'] else ('no side' if x['probabilities'] else '**NO PICK**')
                  print(f"| {x['id']} | {x['teams'][0]} vs {x['teams'][1]} | {x['starts_at']} | "
                        f"{state} | {x['basis'] or 'unresolved'} | {x['source_host'] or '—'} |")
          blanks = a['without_probabilities'] or a['without_pick']
          if blanks:
              print('\n### Active fixtures with no published number\n')
              for x in blanks:
                  print(f"- {x['teams'][0]} vs {x['teams'][1]} ({x['id']}, {x['starts_at']}): "
                        f"{'no pick' if x['probabilities'] else 'no probability'}")
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bdc084c1-probe
          path: |
            data/research/bdc084c1/probe-report.json
            data/research/bdc084c1/probe-report.md
            data/research/bdc084c1/published-latest.json
          retention-days: 14
          if-no-files-found: warn
      - name: Commit this session's own probe evidence back to the session branch
        # Only the report files are committed, [skip ci] stops this commit from
        # starting another run, and the JSON/Markdown are byte-for-byte what the
        # probe wrote - nothing is retyped.
        if: always() && github.ref == 'refs/heads/arena/bdc084c1-maltaproj3'
        run: |
          if [ ! -f data/research/bdc084c1/probe-report.json ]; then
            echo "::warning::No probe report to commit."
            exit 0
          fi
          git config user.name "arena-bdc084c1"
          git config user.email "arena@users.noreply.github.com"
          git add data/research/bdc084c1/probe-report.json data/research/bdc084c1/probe-report.md
          git restore --staged data/research/bdc084c1/published-latest.json 2>/dev/null || true
          git commit -m "evidence(bdc084c1): fresh-snapshot coverage probe [skip ci]" --no-verify
          git push origin HEAD:arena/bdc084c1-maltaproj3
