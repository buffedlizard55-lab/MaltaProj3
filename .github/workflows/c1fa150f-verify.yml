# Session arena-c1fa150f — first-hand live inventory verification (dispatch only).
#
# The Arena sandbox has no egress to Hotspawn, HLTV or the books; the runner does.
# This job runs the production collector and origination once, writes the result
# to a session-only evidence directory, and commits nothing else. It never
# deploys, never rewrites data/latest.json and is removed before the merge.
name: c1fa150f live inventory verification (dispatch only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c1fa150f-verify
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/arena/c1fa150f-maltaproj3'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect the live Hotspawn CS2 inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/live
          python -m scripts.collect --output /tmp/live
      - name: Resolve the live picks (featured, then researched fallbacks)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.originate --output /tmp/live --live
      - name: Record the snapshot and the coverage reconciliation
        run: |
          mkdir -p data/research/c1fa150f/live
          cp /tmp/live/latest.json /tmp/live/sources.json data/research/c1fa150f/live/
          cp /tmp/live/origination.json data/research/c1fa150f/live/ 2>/dev/null || true
          mkdir -p data/research/c1fa150f/live/evidence
          cp /tmp/live/evidence/hotspawn-fixtures.json /tmp/live/evidence/hotspawn-context.json data/research/c1fa150f/live/evidence/ 2>/dev/null || true
          python - <<'PY'
          import json
          from pathlib import Path
          live = json.loads(Path('/tmp/live/latest.json').read_text())
          common = Path('data/research/c1fa150f/live')
          report = {
              'session': 'arena-c1fa150f',
              'purpose': 'First-hand reconciliation of the published Hotspawn CS2 inventory against the live public fixtures API.',
              'inventory_source': live.get('inventory_definition'),
              'generated_at': live.get('generated_at'),
              'inventory_observed_at': live.get('inventory_observed_at'),
              'coverage_complete': live.get('coverage_complete'),
              'run_status': live.get('run_status'),
              'counts': live.get('counts'),
              'records': len(live.get('matches') or []),
              'upcoming': [
                  {'id': m['id'], 'teams': [t.get('name') for t in m.get('teams') or []],
                   'competition': m.get('competition'), 'starts_at': m.get('starts_at'),
                   'locks_at': m.get('locks_at'), 'availability': m.get('availability')}
                  for m in (live.get('matches') or []) if m.get('availability') != 'past'
              ],
              'requests': [{'id': r.get('id'), 'url': r.get('url'), 'status': r.get('status'),
                            'http_status': r.get('http_status'), 'observed_at': r.get('observed_at'),
                            'records': r.get('records')} for r in (live.get('requests') or [])],
          }
          orig_path = Path('/tmp/live/origination.json')
          if orig_path.exists():
              orig = json.loads(orig_path.read_text())
              report['origination'] = {
                  'generated_at': orig.get('generated_at'),
                  'counts': orig.get('counts'),
                  'no_line': [
                      {'id': m['id'], 'teams': [t.get('name') for t in m.get('teams') or []],
                       'method': (m.get('origination') or {}).get('method'),
                       'label': (m.get('origination') or {}).get('label'),
                       'pick_index': m.get('pick_index'),
                       'probabilities': (m.get('origination') or {}).get('probabilities')}
                      for m in (orig.get('matches') or [])
                      if (m.get('origination') or {}).get('method') not in (None, 'market', 'bookmaker', 'consensus', 'reference')
                  ],
              }
          (common / 'coverage.json').write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n')
          print(json.dumps({'records': report['records'], 'counts': report['counts']}, indent=1))
          PY
      - name: Commit the dated evidence to this session branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/c1fa150f
          git diff --cached --quiet && exit 0
          git commit -m 'research(c1fa150f): live inventory and origination snapshot'
          for attempt in 1 2 3 4; do
            git fetch origin arena/c1fa150f-maltaproj3 || true
            git rebase origin/arena/c1fa150f-maltaproj3 || { git rebase --abort || true; sleep 5; continue; }
            git push origin HEAD:arena/c1fa150f-maltaproj3 && exit 0
            sleep 5
          done
          exit 1
