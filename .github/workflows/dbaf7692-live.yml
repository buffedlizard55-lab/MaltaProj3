name: Session live snapshot (arena/dbaf7692)
# Temporary session workspace: runs the real production pipeline on this branch
# so the sandbox can inspect a genuinely current, source-linked snapshot.
# The sandbox has no outbound network, so the runner performs the collection.
# Commits are tagged [data-snapshot] and the push event is skipped for them, so
# this cannot loop. Removed before the integration merge.
on:
  push:
    branches: ['arena/dbaf7692-maltaproj3']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: dbaf7692-live-snapshot
  cancel-in-progress: true
jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[data-snapshot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arena/dbaf7692-maltaproj3
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect Hotspawn inventory and supported external lines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.collect
      - name: Originate picks for every fixture (HLTV + books + model ladder)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.originate --live
      - name: Document why any remaining pick is blank
        run: python -m scripts.coverage_probe --live || echo "::warning::coverage probe failed"
      - name: Capture HLTV match pages / listed odds for pick-less fixtures
        run: python -m scripts.dbaf7692_research || echo "::warning::HLTV odds probe failed"
      - name: Build the site from this snapshot
        run: python -m scripts.build
      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          latest = pathlib.Path('data/latest.json')
          if not latest.exists():
              print('No snapshot written.')
              raise SystemExit
          d = json.loads(latest.read_text())
          print('## Branch live snapshot')
          print(f"- inventory observed: `{d['inventory_observed_at']}`")
          print(f"- counts: `{json.dumps(d['counts'])}`")
          o = pathlib.Path('data/origination.json')
          if o.exists():
              r = json.loads(o.read_text())
              print(f"- origination counts: `{json.dumps(r['counts'])}`")
              print(f"- unresolved ids: `{r.get('unresolved_ids')}`")
          PY
      - name: Publish snapshot data back to this branch
        run: |
          git config user.name 'arena-dbaf7692'
          git config user.email 'arena-dbaf7692@users.noreply.github.com'
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore(session): live source snapshot [data-snapshot]"
          git pull --rebase origin arena/dbaf7692-maltaproj3
          git push origin HEAD:arena/dbaf7692-maltaproj3
