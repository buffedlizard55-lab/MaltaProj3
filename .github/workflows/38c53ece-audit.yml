name: 38C independent current coverage audit
on:
  push:
    branches: [arena/38c53ece-maltaproj3]
    paths: ['scripts/current_coverage_audit.py', '.github/workflows/38c53ece-audit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    if: github.ref == 'refs/heads/arena/38c53ece-maltaproj3'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_current_coverage_audit -v
      - name: Read public snapshots, official inventory, HLTV then esportsbooks
        run: python -m scripts.current_coverage_audit --out data/research/38c53ece/publication-drift
      - name: Collect current official fixtures and research every featured gap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.collect
          python -m scripts.originate --live
      - name: Audit the fresh runner snapshot (not a deployment claim)
        run: python -m scripts.current_coverage_audit --data data
      - name: Replay fresh probabilities and check every rendered row and internal link
        run: |
          python -m scripts.build
          python -m scripts.audit_rows --site site --strict
      - name: Save only the dated read-only audit to the owning branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/38c53ece/
          git diff --cached --quiet && exit 0
          git commit -m 'research: save 38C dated live coverage and line-source observations'
          git pull --rebase origin arena/38c53ece-maltaproj3
          git push origin arena/38c53ece-maltaproj3
