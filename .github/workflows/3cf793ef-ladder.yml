name: 3cf793ef live ladder report
# Branch-scoped, read-only for every canonical feed except this session's own
# evidence directory. It runs the real collector and the real origination
# ladder against live sources, then commits one compact report so the result
# can be reviewed without the Actions log storage host (unreachable from the
# coding sandbox). Removed before the merge; the report stays.
on:
  push:
    branches: ['arena/3cf793ef-maltaproj3']
    paths: ['scripts/3cf793ef_*.py', '.github/workflows/3cf793ef-*.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ladder:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Live collect (canonical inventory + featured lines)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.collect
      - name: Live origination ladder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.originate --live
      - name: Compact per-fixture report
        run: python -m scripts.3cf793ef_ladder_report
      - name: Commit the report to this session branch
        run: |
          git config user.name 'arena-3cf793ef'
          git config user.email 'arena-3cf793ef@users.noreply.github.com'
          git add data/research/3cf793ef/ladder-*.json
          if git diff --cached --quiet; then
            echo 'no report to commit'
          else
            git commit -m "evidence(3cf793ef): what the live ladder produced for every upcoming fixture"
            git push
          fi
      - name: Do not leave generated feeds staged
        if: always()
        run: git checkout -- data/latest.json data/origination.json 2>/dev/null || true
